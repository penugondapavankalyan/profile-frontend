name: Deploy

on:
  push:
    branches:
      - deploy          # only fires when you push to the deploy branch

jobs:

  # ─── JOB 1: Build ────────────────────────────────────────────────────────────
  # Always runs. Injects all VITE_ config, runs npm build, uploads dist/ as artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Base path: '/' for AWS (served from root), '/profile-frontend/' for GitHub Pages
          VITE_BASE_PATH: ${{ secrets.HOST == 'github_pages' && '/profile-frontend/' || '/' }}
          # Sensitive — stays in secrets
          VITE_CHAT_API_BASE_URL: ${{ secrets.VITE_CHAT_API_BASE_URL }}
          # Non-sensitive config — stored as variables
          VITE_CHAT_API_PATH: ${{ vars.VITE_CHAT_API_PATH }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_ENABLE_CHAT: ${{ vars.VITE_ENABLE_CHAT }}
          VITE_PROFILE_NAME: ${{ vars.VITE_PROFILE_NAME }}
          VITE_PROFILE_EMAIL: ${{ vars.VITE_PROFILE_EMAIL }}
          VITE_LINKEDIN_URL: ${{ vars.VITE_LINKEDIN_URL }}
          VITE_GITHUB_URL: ${{ vars.VITE_GITHUB_URL }}
          VITE_CONTACT_LINK: ${{ vars.VITE_CONTACT_LINK }}
          VITE_FEATURED_PROJECT_URL: ${{ vars.VITE_FEATURED_PROJECT_URL }}
          VITE_FEATURED_PROJECT_DEMO_URL: ${{ vars.VITE_FEATURED_PROJECT_DEMO_URL }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── JOB 2: Deploy to AWS ────────────────────────────────────────────────────
  # Runs only when HOST secret = 'aws'
  deploy-aws:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.HOST == 'aws' }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          # JS/CSS have hashed filenames → long cache (1 year, immutable)
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "data/*"

          # index.html → no cache (always fetch latest)
          aws s3 cp dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

          # data/*.json → no cache (content can change without a rebuild)
          aws s3 sync dist/data/ s3://${{ secrets.AWS_S3_BUCKET }}/data/ \
            --delete \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  # ─── JOB 3: Deploy to GitHub Pages ───────────────────────────────────────────
  # Runs only when HOST secret = 'github_pages'
  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ secrets.HOST == 'github_pages' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4